<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alaap Sangeetha Shale · Music School, Bengaluru</title>
<meta name="description" content="Alaap Sangeetha Shale — a music school in Bengaluru. Carnatic and Hindustani vocal, film singing, keyboard, tabla, violin and guitar. Small batches, two recitals a year.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Noto+Serif+Kannada:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --hall:#EBF1F7;         /* pale morning blue */
  --paper:#FFFFFF;
  --ink:#17224A;          /* deep indigo-navy ink */
  --ink2:#5A6488;
  --brand:#2F3E9E;        /* indigo — brand */
  --brand-soft:#E2E6FA;
  --saffron:#F0A517;      /* marigold */
  --peacock:#0E8074;      /* peacock green */
  --coral:#E2503C;        /* warm third */
  --line:#DCE5F0;
  --shadow-s:0 2px 6px -2px rgba(23,34,74,.12);
  --shadow-m:0 18px 38px -24px rgba(23,34,74,.38);
  --shadow-l:0 34px 60px -30px rgba(23,34,74,.32);
  --r:22px;
  --r-s:12px;
  --wrap:1140px;
  --ease:cubic-bezier(.22,.7,.28,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--hall); color:var(--ink);
  font-family:'Anek Kannada',system-ui,sans-serif; font-weight:400;
  font-size:17px; line-height:1.65; overflow-x:hidden;
}
html[data-lang="kn"] body{line-height:1.82}
img{max-width:100%; display:block}
a{color:inherit; text-decoration:none}
button{font-family:inherit}

/* display face swaps with language */
.display{font-weight:700; letter-spacing:-.01em; line-height:1.14; margin:0}
html[data-lang="kn"] .display{font-family:'Noto Serif Kannada',serif; font-weight:700; line-height:1.4; letter-spacing:0}
html[data-lang="en"] .display{font-family:'Instrument Serif',Georgia,serif; font-weight:400; letter-spacing:-.005em}

.wrap{max-width:var(--wrap); margin:0 auto; padding:0 22px}
.eyebrow{
  font-size:12.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--brand); display:flex; align-items:center; gap:9px;
}
html[data-lang="kn"] .eyebrow{letter-spacing:.05em; text-transform:none; font-size:14px}
.eyebrow::before{content:""; width:22px; height:2px; background:var(--saffron); border-radius:2px; flex:none}
.sect{padding:94px 0 8px}
.sect-head{max-width:660px; margin-bottom:38px}
.sect-head h2{font-size:clamp(32px,4.8vw,50px); margin:12px 0 10px}
.sect-head p{color:var(--ink2); margin:0; font-size:17.5px}
:focus-visible{outline:3px solid var(--brand); outline-offset:3px; border-radius:6px}

/* ── preview strip (delete before launch) ───────────────── */
#preview-bar{
  background:var(--ink); color:#E6F2EC; font-size:13.5px;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:9px 46px 9px 22px; position:relative;
}
#preview-bar b{color:var(--saffron); font-weight:600}
#preview-bar button{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:transparent; border:1px solid rgba(255,255,255,.3); color:inherit;
  width:26px; height:26px; border-radius:50%; cursor:pointer; line-height:1;
}
#preview-bar button:hover{background:rgba(255,255,255,.14)}

/* ── header ─────────────────────────────────────────────── */
header{
  position:sticky; top:0; z-index:60;
  background:rgba(235,241,247,.88); backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);
}
.bar{display:flex; align-items:center; gap:20px; height:78px}
.logo{display:flex; align-items:center; gap:11px; flex:none}
.logo-badge{
  width:46px; height:46px; border-radius:14px; flex:none;
  background:linear-gradient(150deg,var(--brand),#4A5AC8 52%,var(--saffron));
  display:grid; place-items:center; box-shadow:var(--shadow-s);
}
.logo-badge svg{width:28px; height:28px}
.logo-name{font-size:23px; line-height:1.1; margin:0; display:block}
html[data-lang="kn"] .logo-name{font-family:'Noto Serif Kannada',serif; font-weight:800; font-size:21px}
html[data-lang="en"] .logo-name{font-family:'Instrument Serif',serif; font-weight:400; letter-spacing:0}
.logo-sub{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink2); font-weight:600; display:block}
html[data-lang="kn"] .logo-sub{letter-spacing:.04em; text-transform:none; font-size:12px}

nav{margin-left:auto; display:flex; align-items:center; gap:4px}
nav a{padding:9px 13px; border-radius:99px; font-size:15.5px; font-weight:500; color:var(--ink2); transition:.2s var(--ease)}
nav a:hover{color:var(--brand); background:var(--brand-soft)}

.lang{display:flex; background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:3px; margin-left:8px; flex:none}
.lang button{
  border:0; background:transparent; cursor:pointer; padding:6px 13px; border-radius:99px;
  font-size:14px; font-weight:600; color:var(--ink2); transition:.2s var(--ease);
}
.lang button[aria-pressed="true"]{background:var(--ink); color:#fff}
.burger{display:none; margin-left:auto; background:var(--paper); border:1px solid var(--line); border-radius:12px; width:44px; height:44px; cursor:pointer}
.burger span{display:block; width:18px; height:2px; background:var(--ink); margin:3.5px auto; border-radius:2px}

/* ── hero ───────────────────────────────────────────────── */
.hero{position:relative; overflow:hidden; padding:70px 0 40px; text-align:center}
.drone{position:absolute; inset:-6% 0 auto; height:118%; width:100%; pointer-events:none; z-index:0}
.drone svg{width:100%; height:100%; mix-blend-mode:multiply; opacity:.72}
.hero .wrap{position:relative; z-index:1}

/* ambient floating chips */
.floaters{position:absolute; inset:0; z-index:0; pointer-events:none; display:none}
.flo{
  position:absolute; width:54px; height:54px; border-radius:50%;
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow-m);
  display:grid; place-items:center; font-size:25px; line-height:1;
  animation:bob 7.5s ease-in-out infinite;
}
.flo.gl{font-family:'Noto Serif Kannada',serif; font-size:23px; font-weight:700; color:var(--brand)}
.flo.sm{width:42px; height:42px; font-size:19px}
.flo.sm.gl{font-size:18px}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-17px) rotate(5deg)}
}
@media (min-width:1180px){ .floaters{display:block} }

/* emoji-led section eyebrows */
.eyebrow.emoji::before{display:none}
.eyebrow .emo{font-size:17px; line-height:1; filter:saturate(1.05)}
.hero-eyebrow{justify-content:center; margin-bottom:20px}
.hero-eyebrow::before{display:none}
.hero-eyebrow span{
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow-s);
  padding:7px 16px; border-radius:99px; color:var(--brand); font-weight:600;
}
.hero h1{font-size:clamp(38px,7.2vw,76px); margin:0 auto; max-width:15ch}
.hero h1 em{font-style:normal; color:var(--brand); position:relative; white-space:nowrap}
.hero h1 em::after{
  content:""; position:absolute; left:-.04em; right:-.04em; bottom:.05em; height:.32em;
  background:var(--saffron); opacity:.34; border-radius:99px; z-index:-1;
}
.quote{max-width:610px; margin:22px auto 0; font-size:19px; color:var(--ink2); padding:0 30px; position:relative}
.quote::before,.quote::after{content:"“"; font-family:'Instrument Serif',serif; font-size:46px; color:var(--coral); position:absolute; top:-4px; left:0; line-height:1; opacity:.6}
.quote::after{content:"”"; left:auto; right:0}
.cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:30px}
.btn{
  display:inline-flex; align-items:center; gap:9px; padding:14px 26px; border-radius:99px;
  font-weight:600; font-size:16px; border:1px solid transparent; cursor:pointer;
  transition:transform .22s var(--ease), box-shadow .22s var(--ease), background .2s, border-color .2s;
}
.btn-primary{background:var(--ink); color:#fff; box-shadow:var(--shadow-m)}
.btn-primary:hover{transform:translateY(-2px); background:var(--brand)}
.btn-ghost{background:var(--paper); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow-s)}
.btn-ghost:hover{transform:translateY(-2px); border-color:var(--brand); color:var(--brand)}

/* ── signature: the swara board ─────────────────────────── */
.board{
  background:var(--paper); border:1px solid var(--line); border-radius:28px;
  box-shadow:var(--shadow-m); padding:26px 26px 22px; margin:46px auto 0; max-width:860px;
}
.board-top{display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.board-top .k{font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2)}
html[data-lang="kn"] .board-top .k{letter-spacing:.03em; text-transform:none; font-size:15px}
.rungs{display:flex; align-items:flex-end; gap:clamp(5px,1vw,11px); height:186px}
.rung{
  flex:1; border:1px solid var(--line); border-radius:16px 16px 10px 10px; cursor:pointer;
  padding:0 0 12px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
  background:var(--paper); box-shadow:var(--shadow-s); transform-origin:bottom;
  transition:transform .3s var(--ease), box-shadow .3s var(--ease), filter .3s;
  animation:grow .65s var(--ease) backwards;
}
.rung:nth-child(1){animation-delay:.04s} .rung:nth-child(2){animation-delay:.11s}
.rung:nth-child(3){animation-delay:.18s} .rung:nth-child(4){animation-delay:.25s}
.rung:nth-child(5){animation-delay:.32s} .rung:nth-child(6){animation-delay:.39s}
.rung:nth-child(7){animation-delay:.46s} .rung:nth-child(8){animation-delay:.53s}
@keyframes grow{from{transform:scaleY(.1); opacity:0}}
.rung .g{font-family:'Noto Serif Kannada',serif; font-weight:700; font-size:clamp(19px,3vw,27px); line-height:1; color:var(--ink)}
.rung .s{font-size:10.5px; font-weight:600; letter-spacing:.05em; color:var(--ink2); margin-top:7px; text-align:center; padding:0 3px}
.rung:hover{transform:translateY(-5px); box-shadow:var(--shadow-l)}
.rung.lit{filter:brightness(1.06); transform:translateY(-7px)}
.rung{background:linear-gradient(180deg,#fff,#F1F5FC)}
.rung.v{background:linear-gradient(180deg,#fff,var(--brand-soft)); border-color:#C6CEF0}
.rung.v .g{color:var(--brand)}
.rung .s{font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:.02em; color:var(--ink2)}
.rung .g{position:relative; display:inline-block; padding:.34em .06em 0}
.rung .g::after,.rung .g::before{
  content:""; position:absolute; left:50%; width:4px; height:4px; border-radius:50%;
  background:currentColor; opacity:0;
}
.rung .g.hi::after{top:.02em; transform:translateX(-50%); opacity:1}
.rung .g.hi2::after{top:.02em; transform:translateX(-50%) translateX(-4px); opacity:1}
.rung .g.hi2::before{top:.02em; transform:translateX(-50%) translateX(4px); opacity:1}
.rung .g.lo::after{bottom:-.16em; transform:translateX(-50%); opacity:1}
.octs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.board-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:20px}
.tiny{
  background:var(--hall); border:1px solid var(--line); border-radius:99px; padding:9px 17px;
  font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; transition:.2s var(--ease);
}
.tiny:hover{border-color:var(--brand); color:var(--brand)}
.tiny[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
.board-foot .hint{font-size:14.5px; color:var(--ink2); margin:0}

/* ── notice board ticker ────────────────────────────────── */
.notice{margin-top:52px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--paper)}
.notice-in{display:flex; align-items:center; overflow:hidden}
.notice-label{
  flex:none; padding:15px 30px 15px 20px; background:var(--saffron); color:#4A2E00;
  font-weight:700; font-size:14px; letter-spacing:.05em;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);
}
.marquee{overflow:hidden; flex:1; mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.marquee-track{display:flex; width:max-content; animation:slide 36s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.tick{display:flex; align-items:center; gap:10px; padding:15px 26px; font-size:15.5px; white-space:nowrap; color:var(--ink2)}
.tick b{color:var(--ink); font-weight:600}
.tick .dot{width:6px; height:6px; border-radius:50%; background:var(--coral); flex:none}

/* ── about + ledger ─────────────────────────────────────── */
.about-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:start}
.about-body p{color:var(--ink2); font-size:18px}
.about-body p.lead{color:var(--ink); font-size:21px; font-weight:500}
.ledger{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:8px 26px; box-shadow:var(--shadow-m)}
.ledger-row{display:flex; align-items:baseline; gap:14px; padding:19px 0; border-bottom:1px dashed var(--line)}
.ledger-row:last-child{border-bottom:0}
.ledger-n{font-size:38px; line-height:1; font-weight:700; color:var(--brand); font-family:'Noto Serif Kannada',serif; min-width:92px}
.ledger-k{font-size:15.5px; color:var(--ink2)}

/* ── courses ────────────────────────────────────────────── */
.chips{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:30px}
.chip{
  background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:9px 18px;
  font-size:14.5px; font-weight:500; color:var(--ink2); cursor:pointer; transition:.2s var(--ease);
}
.chip:hover{border-color:var(--brand); color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
.courses{display:grid; grid-template-columns:repeat(3,1fr); gap:24px}
.course{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  cursor:pointer; text-align:left; padding:0; box-shadow:var(--shadow-s);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease); display:flex; flex-direction:column;
}
.course:hover{transform:translateY(-6px) rotate(-.4deg); box-shadow:var(--shadow-l)}
.plate{aspect-ratio:4/2.9; padding:22px; display:flex; flex-direction:column; justify-content:space-between; position:relative}
.plate::after{content:""; position:absolute; inset:0; opacity:.5; background:radial-gradient(circle at 80% 14%,rgba(255,255,255,.85),transparent 56%)}
.plate-sw{font-family:'Noto Serif Kannada',serif; font-size:30px; font-weight:700; color:rgba(23,34,74,.34); position:relative; z-index:1; line-height:1}
.plate-t{font-size:27px; margin:0; position:relative; z-index:1; max-width:13ch}
.course-meta{padding:18px 22px 22px; display:flex; flex-direction:column; gap:9px; flex:1}
.tagline{font-size:15px; color:var(--ink2); flex:1}
.course-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px}
.pill{background:var(--brand-soft); color:var(--brand); font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:99px}
.more{color:var(--brand); font-weight:600; font-size:14px}

/* ── the path (five stages) ─────────────────────────────── */
.rail{position:relative; padding-left:38px; margin-top:6px}
.rail::before{content:""; position:absolute; left:9px; top:10px; bottom:10px; width:2px; background:linear-gradient(var(--brand),var(--coral),var(--peacock),var(--saffron)); border-radius:2px; opacity:.42}
.stop{position:relative; padding:0 0 34px}
.stop::before{
  content:""; position:absolute; left:-38px; top:6px; width:20px; height:20px; border-radius:50%;
  background:var(--paper); border:3px solid var(--brand);
}
.stop:nth-child(2)::before{border-color:var(--coral)}
.stop:nth-child(3)::before{border-color:var(--peacock)}
.stop:nth-child(4)::before{border-color:var(--saffron)}
.stop:nth-child(5)::before{border-color:var(--brand)}
.stop-n{font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--brand)}
.stop h3{margin:2px 0 5px; font-size:22px; font-weight:600}
.stop p{margin:0; color:var(--ink2); font-size:16.5px; max-width:62ch}

/* ── teachers ───────────────────────────────────────────── */
.lead-pair{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:24px}
.person{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:26px; box-shadow:var(--shadow-s); transition:.28s var(--ease)}
.person:hover{box-shadow:var(--shadow-m); transform:translateY(-4px)}
.person-top{display:flex; align-items:center; gap:16px}
.avatar{width:66px; height:66px; border-radius:20px; flex:none; display:grid; place-items:center; font-size:27px; font-weight:700; color:#fff; font-family:'Noto Serif Kannada',serif}
.person h3{margin:0; font-size:21px; font-weight:600}
.person .role{font-size:14px; color:var(--brand); font-weight:600}
.person p{margin:15px 0 0; color:var(--ink2); font-size:16px}
.crew{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
.crew .person{padding:20px}
.crew .avatar{width:50px; height:50px; border-radius:16px; font-size:21px}
.crew h3{font-size:18px}
.crew p{font-size:15px; margin-top:12px}

/* ── batches table ──────────────────────────────────────── */
.tbl-wrap{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-m); overflow:hidden}
table{width:100%; border-collapse:collapse}
th{
  text-align:left; font-size:12.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink2); padding:16px 22px; background:var(--hall); border-bottom:1px solid var(--line);
}
html[data-lang="kn"] th{letter-spacing:.03em; text-transform:none; font-size:14.5px}
td{padding:16px 22px; border-bottom:1px solid var(--line); font-size:16px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hall)}
td.name{font-weight:600}
td.fee{color:var(--brand); font-weight:700; white-space:nowrap}
.seats{font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:99px; white-space:nowrap}
.seats.open{background:#D8EFE7; color:#0B6B4E}
.seats.few{background:#FCE9C4; color:#8A5600}
.seats.full{background:#FBDCD1; color:#A33418}

/* ── voices ─────────────────────────────────────────────── */
.voices{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
.voice{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:26px; box-shadow:var(--shadow-s)}
.voice-mark{font-family:'Instrument Serif',serif; font-size:54px; line-height:.6; color:var(--coral); opacity:.55}
.voice p{margin:10px 0 16px; font-size:16.5px}
.voice .who{font-size:14px; color:var(--ink2); font-weight:600}

/* ── enrol + contact ────────────────────────────────────── */
.enrol-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:start}
.form-card{background:var(--paper); border:1px solid var(--line); border-radius:28px; padding:32px; box-shadow:var(--shadow-m)}
.field{margin-bottom:16px}
.field label{display:block; font-size:14px; font-weight:600; margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%; padding:13px 15px; border-radius:var(--r-s); border:1px solid var(--line);
  background:var(--hall); font-family:inherit; font-size:16px; color:var(--ink); transition:.2s;
}
.field textarea{min-height:104px; resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); background:var(--paper)}
.field input.bad,.field select.bad{border-color:var(--coral); box-shadow:0 0 0 4px #FBDCD1}
.two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.form-btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
.form-note{font-size:14px; color:var(--ink2); margin:14px 0 0}
.form-note.bad{color:var(--coral); font-weight:600}
.form-note.good{color:var(--brand); font-weight:600}
.reach{display:flex; flex-direction:column; gap:13px; margin-top:22px}
.reach a{display:flex; gap:13px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-s); padding:14px 16px; box-shadow:var(--shadow-s); transition:.2s var(--ease)}
.reach a:hover{border-color:var(--brand); transform:translateX(3px)}
.reach svg{width:20px; height:20px; stroke:var(--brand); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
.reach .k{font-size:12.5px; color:var(--ink2); display:block; line-height:1.3}
.reach .v{font-weight:600; font-size:15.5px}

/* ── footer ─────────────────────────────────────────────── */
footer{margin-top:92px; border-top:1px solid var(--line); background:var(--paper)}
.foot{display:flex; align-items:center; justify-content:space-between; gap:22px; padding:30px 0; flex-wrap:wrap; font-size:14.5px; color:var(--ink2)}
.social{display:flex; gap:9px}
.social a{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; transition:.22s var(--ease)}
.social a:hover{background:var(--brand); border-color:var(--brand); transform:translateY(-3px)}
.social a:hover svg{fill:#fff}
.social svg{width:17px; height:17px; fill:var(--ink2); transition:fill .22s}

/* ── detail sheet ───────────────────────────────────────── */
.sheet{position:fixed; inset:0; z-index:100; display:none; padding:26px}
.sheet.open{display:grid; place-items:center}
.veil{position:absolute; inset:0; background:rgba(23,34,74,.44); backdrop-filter:blur(4px)}
.sheet-card{
  position:relative; background:var(--paper); border-radius:28px; max-width:760px; width:100%;
  max-height:88vh; overflow-y:auto; box-shadow:0 50px 90px -40px rgba(23,34,74,.6);
  animation:pop .3s var(--ease);
}
@keyframes pop{from{opacity:0; transform:translateY(18px) scale(.98)}}
.sheet-hero{padding:34px 34px 26px; position:relative}
.sheet-hero h2{font-size:clamp(30px,4.4vw,44px); margin:8px 0 6px}
.sheet-body{padding:28px 34px 34px}
.facts{display:grid; grid-template-columns:repeat(3,1fr); gap:2px 20px; margin:0 0 24px; padding:20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.facts div{padding:8px 0}
.facts dt{font-size:12.5px; color:var(--ink2); letter-spacing:.04em}
.facts dd{margin:2px 0 0; font-weight:600; font-size:16.5px}
.syl{list-style:none; padding:0; margin:0 0 24px}
.syl li{position:relative; padding:0 0 10px 28px; color:var(--ink2); font-size:16.5px}
.syl li::before{
  content:""; position:absolute; left:0; top:.55em; width:9px; height:9px; border-radius:50%;
  background:var(--saffron);
}
.bring{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.bring span{font-size:13.5px; background:var(--hall); border:1px solid var(--line); padding:5px 12px; border-radius:99px}
.close{position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-size:19px; line-height:1; color:var(--ink); z-index:2}
.close:hover{background:var(--brand); color:#fff; border-color:var(--brand)}

/* ── to top ─────────────────────────────────────────────── */
#toTop{
  position:fixed; right:20px; bottom:20px; width:48px; height:48px; border-radius:50%;
  background:var(--ink); color:#fff; border:0; cursor:pointer; z-index:80;
  box-shadow:var(--shadow-m); display:grid; place-items:center; font-size:19px;
  opacity:0; pointer-events:none; transform:translateY(10px); transition:.28s var(--ease);
}
#toTop.on{opacity:1; pointer-events:auto; transform:none}
#toTop:hover{background:var(--brand)}

/* ── reveal ─────────────────────────────────────────────── */
.rise{opacity:0; transform:translateY(22px); transition:opacity .7s var(--ease), transform .7s var(--ease)}
.rise.in{opacity:1; transform:none}

/* ── responsive ─────────────────────────────────────────── */
@media (max-width:900px){
  .about-grid,.enrol-grid,.lead-pair{grid-template-columns:1fr; gap:30px}
  .courses,.voices{grid-template-columns:repeat(2,1fr)}
  .crew{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:1fr 1fr}
  nav{position:fixed; inset:78px 0 auto; background:var(--paper); flex-direction:column; align-items:stretch; padding:14px; gap:2px; border-bottom:1px solid var(--line); box-shadow:var(--shadow-m); display:none; margin:0}
  nav.open{display:flex}
  nav a{padding:13px 16px; font-size:17px}
  .burger{display:block}
  .lang{margin:8px 0 0; justify-content:center}
  .bar{gap:12px}
  .sect{padding:70px 0 4px}
  .rungs{height:150px; gap:3px}
  .rung{border-radius:11px 11px 7px 7px}
  .rung .g{font-size:16px}
  .rung .s{font-size:9px}
  .form-card{padding:24px}
}
@media (max-width:600px){
  .courses,.voices,.crew,.two{grid-template-columns:1fr}
  .notice-label{padding:13px 22px 13px 16px; font-size:13px}
  .board{padding:20px 16px 18px; border-radius:22px}
  .rungs{gap:2px; height:126px}
  .rung{border-radius:8px 8px 5px 5px}
  .rung .g{font-size:12.5px}
  .rung .s{display:none}
  .board-top{gap:6px}
  .sheet{padding:0}
  .sheet-card{border-radius:0; max-height:100vh; height:100%}
  .tbl-wrap{overflow-x:auto}
  table{min-width:620px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
  html{scroll-behavior:auto}
  .rise{opacity:1; transform:none}
  .flo{animation:none}
}
</style>
</head>
<body>

<!-- preview notice — delete this whole block before launch -->

<header>
  <div class="wrap bar">

          <path d="M20 22.6c4.6 0 8 3.7 8 8.3s-3.6 7.9-8 7.9-8-3.4-8-7.9 3.4-8.3 8-8.3Z" fill="#fff"/>

<main id="top">

  <!-- HERO -->
  <section class="hero">

      <span class="flo"     style="right:3%;  top:14%; animation-delay:-1.7s">🪘</span>

let lang = 'en';

const n = v => lang === 'kn' ? String(v).replace(/[0-9]/g, d => KN_D[+d]) : String(v);
const L = o => (o && typeof o === 'object' && !Array.isArray(o)) ? (o[lang] ?? o.en) : o;
const t = k => L(STR[k]) || '';
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const money = v => '₹' + n(v.toLocaleString('en-IN'));

function paintStatic(){
  document.documentElement.lang = lang;
  document.documentElement.dataset.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = t(node.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(node => { node.innerHTML = t(node.dataset.i18nHtml); });
  const pv = document.querySelector('#preview-bar span');
  if (pv) pv.innerHTML = t('preview');
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langBtn === lang)));
  document.title = lang === 'kn' ? 'ಆಲಾಪ್ ಸಂಗೀತ ಶಾಲೆ · ಬೆಂಗಳೂರು' : 'Alaap Sangeetha Shale · Music School, Bengaluru';
}

function paintTicker(){
  const row = NOTICES.map(u => `<span class="tick"><span class="dot"></span><b>${esc(L(u))}</b></span>`).join('');
  document.getElementById('ticker').innerHTML = row + row;
}

function paintLedger(){
  document.getElementById('ledger').innerHTML = STR.ledger.map(r =>
    `<div class="ledger-row"><span class="ledger-n">${n(r.n)}${r.suffix||''}</span><span class="ledger-k">${esc(L(r))}</span></div>`
  ).join('');
}

function octDot(s){
  if (oct === 0) return s.top ? '' : 'lo';        /* mandra: dot below, closing Sa is madhya */
  if (oct === 1) return s.top ? 'hi' : '';        /* madhya: bare, closing Sa carries a dot */
  return s.top ? 'hi2' : 'hi';                    /* tara: dot above, closing Sa gets two */
}
function paintRungs(){
  const box = document.getElementById('rungs');
  box.innerHTML = '';
  SWARAS.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'rung' + (s.v ? ' v' : '');
    b.style.height = (40 + i * 4.6) + '%';
    b.style.flexGrow = s.v ? '.62' : '1';
    b.setAttribute('aria-label', L(s));
    b.innerHTML = `<span class="g ${octDot(s)}">${lang === 'kn' ? s.g : s.e}</span><span class="s">${s.w}</span>`;
    const say = () => { document.getElementById('swaraName').textContent = L(s); };
    b.onclick = () => { pluck(s.f * OCT[oct], b); say(); };
    b.onmouseenter = say;
    b.onfocus = say;
    box.appendChild(b);
  });
  document.getElementById('swaraName').textContent = t('board.sub');
}

function paintOcts(){
  const box = document.getElementById('octs');
  box.innerHTML = '';
  ['oct.mandra','oct.madhya','oct.tara'].forEach((k, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tiny';
    b.textContent = t(k);
    b.setAttribute('aria-pressed', String(oct === i));
    b.onclick = () => { oct = i; paintOcts(); paintRungs(); };
    box.appendChild(b);
  });
}

function paintChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  [{id:'all'}, ...CATS].forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.textContent = c.id === 'all' ? t('courses.all') : L(c);
    b.setAttribute('aria-pressed', String(filter === c.id));
    b.onclick = () => { filter = c.id; paintChips(); paintCourses(); };
    box.appendChild(b);
  });
}

  const grid = document.getElementById('courseGrid');
  grid.innerHTML = '';
  COURSES.filter(c => filter === 'all' || c.cat === filter).forEach(c => {
    const cat = CATS.find(x => x.id === c.cat);
    const card = document.createElement('button');
    card.type = 'button'; card.className = 'course';
    card.innerHTML = `
      <span class="plate" style="background:linear-gradient(150deg,${c.hue[0]},${c.hue[1]})">
        <span class="plate-sw">${c.sw}</span>
        <span class="plate-t display">${esc(L(c.t))}</span>

}

function fillSelect(id, list, extra){

}

      <div><dt>${esc(t('f.teacher'))}</dt><dd>${esc(L(c.teacher))}</dd></div>
      <div><dt>${esc(t('f.level'))}</dt><dd>${esc(L(c.level))}</dd></div>
      <div><dt>${esc(t('f.age'))}</dt><dd>${n(c.age)} ${esc(t('u.yrs'))}</dd></div>
      <div><dt>${esc(t('f.class'))}</dt><dd>${n(c.mins)} ${esc(t('u.min'))}</dd></div>
      <div><dt>${esc(t('f.week'))}</dt><dd>${n(c.week)} ${esc(t('u.classes'))}</dd></div>
      <div><dt>${esc(t('f.term'))}</dt><dd>${n(c.term)} ${esc(t('u.months'))}</dd></div>
    </dl>
    <h3 class="display" style="font-size:22px;margin:0 0 8px">${esc(t('sheet.about'))}</h3>
    <p style="margin:0 0 24px;color:var(--ink2);font-size:17px">${esc(L(c.about))}</p>
    <h3 class="display" style="font-size:22px;margin:0 0 12px">${esc(t('sheet.learn'))}</h3>
    <ul class="syl">${L(c.learn).map(x => `<li>${esc(x)}</li>`).join('')}</ul>

    <div class="bring">${L(c.bring).map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
  sheet.querySelector('.close').focus();
}
function closeSheet(){
  sheet.classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
sheet.querySelectorAll('[data-close]').forEach(x => x.onclick = closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

/* ── audio: swaras and drone ────────────────────────────── */
let AC = null, droneNodes = null;
function ctx(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function pluck(freq, el){
  const a = ctx(), now = a.currentTime, g = a.createGain();
  g.connect(a.destination);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.7);
  [['triangle', 1, 0.6], ['sine', 2, 0.16]].forEach(([type, mult, amp]) => {
    const o = a.createOscillator(), og = a.createGain();
    o.type = type; o.frequency.value = freq * mult; og.gain.value = amp;
    o.connect(og); og.connect(g); o.start(now); o.stop(now + 1.8);
  });
  if (el){ el.classList.add('lit'); setTimeout(() => el.classList.remove('lit'), 300); }
}
function runScale(idxs, gap){
  const rungs = document.querySelectorAll('.rung');
  idxs.forEach((si, step) => setTimeout(() => {
    pluck(SWARAS[si].f * OCT[oct], rungs[si]);
    document.getElementById('swaraName').textContent = L(SWARAS[si]);
  }, step * gap));
}
document.getElementById('btnAaro').onclick = () => runScale(SHUDDHA, 240);
document.getElementById('btnAll').onclick  = () => runScale(SWARAS.map((_, i) => i), 175);
document.getElementById('btnDrone').onclick = function(){
  const a = ctx();
  if (droneNodes){
    droneNodes.g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.6);
    droneNodes.osc.forEach(o => o.stop(a.currentTime + 0.7));
    droneNodes = null;
    this.setAttribute('aria-pressed', 'false');
    return;
  }
  const g = a.createGain();
  g.gain.value = 0.0001; g.connect(a.destination);
  g.gain.exponentialRampToValueAtTime(0.07, a.currentTime + 1.2);
  const osc = [130.81, 261.63, 392.45].map(base => {
    const f = base * OCT[oct];
    const o = a.createOscillator(), og = a.createGain();
    o.type = 'sine'; o.frequency.value = f; og.gain.value = 0.4;
    o.connect(og); og.connect(g); o.start(); return o;
  });
  droneNodes = {g, osc};
  this.setAttribute('aria-pressed', 'true');
};

/* ── enrolment form ─────────────────────────────────────── */
function compose(){
  const v = id => document.getElementById(id).value.trim();
  const S = id => document.getElementById(id).selectedOptions[0].textContent;
  const note = document.getElementById('formNote');
  document.querySelectorAll('.bad').forEach(e => e.classList.remove('bad'));
  const fail = (id, key) => {
    const f = document.getElementById(id);
    f.classList.add('bad'); f.focus();
    note.className = 'form-note bad'; note.textContent = t(key);
    return null;
  };
  if (!v('f-name'))  return fail('f-name', 'form.needName');
  if (!v('f-age'))   return fail('f-age', 'form.needAge');
  if (!v('f-phone')) return fail('f-phone', 'form.needPhone');
  if (!/^[0-9+\s-]{10,15}$/.test(v('f-phone'))) return fail('f-phone', 'form.badPhone');

  note.className = 'form-note good';
  note.textContent = t('form.opened');
  const lbl = k => t(k);
  return [
    (lang === 'kn' ? 'ಹೊಸ ದಾಖಲಾತಿ ವಿನಂತಿ' : 'New enrolment enquiry') + ' — ' + t('brand'), '',
    `${lbl('form.name')}: ${v('f-name')}`,
    `${lbl('form.age')}: ${v('f-age')}`,
    `${lbl('form.phone')}: ${v('f-phone')}`,
    `${lbl('form.mail')}: ${v('f-mail') || '—'}`,
    `${lbl('form.course')}: ${S('f-course')}`,
    `${lbl('form.mode')}: ${S('f-mode')}`,
    `${lbl('form.exp')}: ${S('f-exp')}`,
    `${lbl('form.msg')}: ${v('f-msg') || '—'}`
  ].join('\n');
}
document.getElementById('sendWa').onclick = () => {
  const m = compose();
  if (m) window.open(`https://wa.me/${SCHOOL_WA}?text=${encodeURIComponent(m)}`, '_blank');
};
document.getElementById('sendMail').onclick = () => {
  const m = compose();
  if (!m) return;
  const subj = (lang === 'kn' ? 'ದಾಖಲಾತಿ' : 'Enrolment') + ' — ' + document.getElementById('f-name').value.trim();
  window.location.href = `mailto:${SCHOOL_MAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(m)}`;
};

/* ── language, nav, scroll ──────────────────────────────── */
function setLang(next){
  lang = next;
  if (sheet.classList.contains('open')) closeSheet();
  render();
}
document.querySelectorAll('[data-lang-btn]').forEach(b => b.onclick = () => setLang(b.dataset.langBtn));

const nav = document.getElementById('nav'), burger = document.getElementById('burger');
burger.onclick = () => {
  const open = nav.classList.toggle('open');
  burger.setAttribute('aria-expanded', String(open));
};
nav.querySelectorAll('a').forEach(a => a.onclick = () => { nav.classList.remove('open'); burger.setAttribute('aria-expanded','false'); });

const toTop = document.getElementById('toTop');
toTop.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
addEventListener('scroll', () => toTop.classList.toggle('on', scrollY > 700));

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.rise').forEach(x => io.observe(x));

function render(){
  paintStatic(); paintTicker(); paintLedger(); paintOcts(); paintRungs(); paintChips(); paintCourses();
  paintPath(); paintTeam(); paintBatches(); paintVoices(); paintReach(); paintForm();
}
render();
</script>
